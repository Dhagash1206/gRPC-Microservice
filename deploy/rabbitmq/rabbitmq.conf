# TLS only: the plaintext listener is disabled and clients must present a cert.
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /certs/ca.crt
ssl_options.certfile = /certs/rabbitmq.crt
ssl_options.keyfile = /certs/rabbitmq.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true
ssl_options.versions.1 = tlsv1.3

# AMQP clients log in as their certificate CN; there are no AMQP passwords.
auth_mechanisms.1 = EXTERNAL
ssl_cert_login_from = common_name

# Users, vhost and least-privilege permissions. Replaces the default guest user.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json

management.tcp.port = 15672
