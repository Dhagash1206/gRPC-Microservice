# Receives OTLP over mTLS from every service and Envoy.
#   traces  -> Jaeger, and -> spanmetrics (RED metrics for every service, incl. Python)
#   metrics -> Prometheus scrape endpoint (:8889)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /certs/otel-collector.crt
          key_file: /certs/otel-collector.key
          client_ca_file: /certs/ca.crt
          min_version: "1.3"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
  batch: {}

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    dimensions:
      - name: rpc.method
      - name: rpc.grpc.status_code
    metrics_flush_interval: 15s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true # internal observability network
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
