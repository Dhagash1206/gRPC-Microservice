syntax = "proto3";

package shop.payment.v1;

option go_package = "grpcshop/gen/shop/payment/v1;paymentv1";

service PaymentService {
  // Idempotent per idempotency_key: a retry returns the original outcome (success or decline).
  // FAILED_PRECONDITION if declined or cancelled; INVALID_ARGUMENT if the key is reused
  // with different parameters.
  rpc Charge(ChargeRequest) returns (ChargeResponse);

  // Saga compensation. Refunds a successful charge; if no charge exists yet, records
  // a fence so a late Charge with this key fails. Idempotent.
  rpc CancelCharge(CancelChargeRequest) returns (CancelChargeResponse);

  // Read-only: the stored outcome for idempotency_key. NOT_FOUND if neither a charge
  // nor a fence exists. Lets saga recovery tell a paid order from an unpaid one.
  rpc GetCharge(GetChargeRequest) returns (GetChargeResponse);
}

enum ChargeStatus {
  CHARGE_STATUS_UNSPECIFIED = 0;
  CHARGE_STATUS_SUCCEEDED = 1;
  CHARGE_STATUS_DECLINED = 2;
  CHARGE_STATUS_REFUNDED = 3;
  // A fence: cancelled before any charge was made.
  CHARGE_STATUS_CANCELLED = 4;
}

enum CancelOutcome {
  CANCEL_OUTCOME_UNSPECIFIED = 0;
  // No charge existed; future charges with this key are rejected.
  CANCEL_OUTCOME_FENCED = 1;
  CANCEL_OUTCOME_REFUNDED = 2;
  // The charge had been declined, so there is nothing to refund.
  CANCEL_OUTCOME_NOTHING_TO_REFUND = 3;
}

message CancelChargeRequest {
  string idempotency_key = 1;
}

message CancelChargeResponse {
  CancelOutcome outcome = 1;
}

message ChargeRequest {
  string idempotency_key = 1;
  string customer_id = 2;
  int64 amount_cents = 3;
  // ISO 4217 code of amount_cents, e.g. "USD". Required.
  string currency_code = 4;
}

message ChargeResponse {
  string payment_id = 1;
}

message GetChargeRequest {
  string idempotency_key = 1;
}

message GetChargeResponse {
  string payment_id = 1;
  ChargeStatus status = 2;
}
