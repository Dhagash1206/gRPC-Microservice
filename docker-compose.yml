# Network segmentation: each database sits on its own internal network that only
# its owning service joins, so a compromised service cannot even reach another
# service's database. Only Envoy (8443) is published on all interfaces; the
# RabbitMQ and Mailpit UIs are bound to localhost for development.
#
# All traffic is TLS: gRPC (mTLS), Postgres (TLS 1.3, client-cert login, no
# passwords), RabbitMQ (TLS 1.3, SASL EXTERNAL, no passwords), SMTP (STARTTLS).

x-postgres: &postgres
  image: postgres:17-alpine
  entrypoint: ["/bin/sh", "/deploy/tls-entrypoint.sh"]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -h /var/run/postgresql"]
    interval: 3s
    timeout: 3s
    retries: 20

x-service-healthcheck: &service-healthcheck
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 5s

services:
  inventory-db:
    <<: *postgres
    environment: { TLS_NAME: inventory-db, APP_ROLE: inventory, APP_DATABASE: inventory, POSTGRES_HOST_AUTH_METHOD: trust }
    volumes:
      - ./certs:/certs:ro
      - ./deploy/postgres:/deploy:ro
      - ./deploy/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
      - inventory-db:/var/lib/postgresql/data
    networks: [inventory-data]

  payment-db:
    <<: *postgres
    environment: { TLS_NAME: payment-db, APP_ROLE: payment, APP_DATABASE: payment, POSTGRES_HOST_AUTH_METHOD: trust }
    volumes:
      - ./certs:/certs:ro
      - ./deploy/postgres:/deploy:ro
      - ./deploy/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
      - payment-db:/var/lib/postgresql/data
    networks: [payment-data]

  order-db:
    <<: *postgres
    environment: { TLS_NAME: order-db, APP_ROLE: order, APP_DATABASE: order, POSTGRES_HOST_AUTH_METHOD: trust }
    volumes:
      - ./certs:/certs:ro
      - ./deploy/postgres:/deploy:ro
      - ./deploy/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
      - order-db:/var/lib/postgresql/data
    networks: [order-data]

  notification-db:
    <<: *postgres
    environment: { TLS_NAME: notification-db, APP_ROLE: notification, APP_DATABASE: notification, POSTGRES_HOST_AUTH_METHOD: trust }
    volumes:
      - ./certs:/certs:ro
      - ./deploy/postgres:/deploy:ro
      - ./deploy/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
      - notification-db:/var/lib/postgresql/data
    networks: [notification-data]

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq # fixed node name, so the data volume survives container recreation
    volumes:
      - ./certs:/certs:ro
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./deploy/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq:/var/lib/rabbitmq
    ports: ["127.0.0.1:15672:15672"] # management UI, admin/admin (dev only)
    networks: [events, broker-metrics, public] # public only so the UI port can be published
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_listener", "5671"]
      interval: 5s
      timeout: 10s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_SMTP_TLS_CERT: /certs/mailpit.crt
      MP_SMTP_TLS_KEY: /certs/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
    volumes: ["./certs:/certs:ro"]
    ports: ["127.0.0.1:8025:8025"] # inbox UI / API (dev only)
    networks: [mail, public] # public only so the UI port can be published

  inventory:
    image: grpcshop-python:dev
    build: { context: ., dockerfile: python/Dockerfile }
    command: ["python", "-m", "inventory_service.main"]
    environment:
      OTEL_COLLECTOR_ADDR: otel-collector:4317
      PORT: "50052"
      DATABASE_URL: postgresql://inventory@inventory-db:5432/inventory
      ALLOWED_CALLERS: order,envoy
      RESERVATION_TTL_SECONDS: "900"
      TLS_CERT_FILE: /certs/inventory.crt
      TLS_KEY_FILE: /certs/inventory.key
      TLS_CA_FILE: /certs/ca.crt
    volumes: ["./certs:/certs:ro"]
    networks: [edge, services, inventory-data, observability]
    healthcheck: { <<: *service-healthcheck, test: ["CMD", "python", "-m", "common.healthcheck"] }
    depends_on:
      inventory-db: { condition: service_healthy }

  payment:
    image: grpcshop-python:dev
    build: { context: ., dockerfile: python/Dockerfile }
    command: ["python", "-m", "payment_service.main"]
    environment:
      OTEL_COLLECTOR_ADDR: otel-collector:4317
      PORT: "50053"
      DATABASE_URL: postgresql://payment@payment-db:5432/payment
      MAX_CHARGE_CENTS: "100000"
      ALLOWED_CALLERS: order
      TLS_CERT_FILE: /certs/payment.crt
      TLS_KEY_FILE: /certs/payment.key
      TLS_CA_FILE: /certs/ca.crt
    volumes: ["./certs:/certs:ro"]
    networks: [services, payment-data, observability]
    healthcheck: { <<: *service-healthcheck, test: ["CMD", "python", "-m", "common.healthcheck"] }
    depends_on:
      payment-db: { condition: service_healthy }

  order:
    build: { context: ./go, args: { SERVICE: order } }
    environment:
      OTEL_COLLECTOR_ADDR: otel-collector:4317
      PORT: "50051"
      DATABASE_URL: postgres://order@order-db:5432/order?sslmode=verify-full&sslrootcert=/certs/ca.crt&sslcert=/certs/order.crt&sslkey=/certs/order.key
      INVENTORY_ADDR: inventory:50052
      PAYMENT_ADDR: payment:50053
      RABBITMQ_URL: amqps://rabbitmq:5671/
      # dev-client lets local tools call order directly; production: envoy only.
      ALLOWED_CALLERS: envoy,dev-client
      RECOVERY_STALE_AFTER: 60s
      TLS_CERT_FILE: /certs/order.crt
      TLS_KEY_FILE: /certs/order.key
      TLS_CA_FILE: /certs/ca.crt
    volumes: ["./certs:/certs:ro"]
    networks: [edge, services, order-data, events, observability]
    healthcheck: { <<: *service-healthcheck, test: ["CMD", "/app", "healthcheck"] }
    depends_on:
      order-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      inventory: { condition: service_healthy }
      payment: { condition: service_healthy }
      # Declares the consumer queue so the first events are routable.
      notification: { condition: service_started }

  notification:
    build: { context: ./go, args: { SERVICE: notification } }
    environment:
      OTEL_COLLECTOR_ADDR: otel-collector:4317
      RABBITMQ_URL: amqps://rabbitmq:5671/
      DATABASE_URL: postgres://notification@notification-db:5432/notification?sslmode=verify-full&sslrootcert=/certs/ca.crt&sslcert=/certs/notification.crt&sslkey=/certs/notification.key
      SMTP_ADDR: mailpit:1025
      TLS_CERT_FILE: /certs/notification.crt
      TLS_KEY_FILE: /certs/notification.key
      TLS_CA_FILE: /certs/ca.crt
    volumes: ["./certs:/certs:ro"]
    networks: [events, notification-data, mail, observability]
    depends_on:
      rabbitmq: { condition: service_healthy }
      notification-db: { condition: service_healthy }
      mailpit: { condition: service_started }

  envoy:
    build: { context: ., dockerfile: envoy/Dockerfile }
    ports: ["8443:8443"]
    volumes: ["./certs:/etc/envoy/certs:ro"]
    networks: [public, edge, observability]
    depends_on:
      order: { condition: service_healthy }
      inventory: { condition: service_healthy }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      - ./certs:/certs:ro
    networks: [observability]

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports: ["127.0.0.1:16686:16686"] # tracing UI (dev only)
    networks: [observability, public]

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports: ["127.0.0.1:9090:9090"] # metrics + alerts UI (dev only)
    networks: [observability, broker-metrics, public]

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin # dev only
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/grpcshop.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"] # dashboards (dev only)
    networks: [observability, public]
    depends_on: [prometheus, jaeger]

networks:
  public: {} # host port publishing
  observability: { internal: true } # telemetry export, scraping, dashboards
  broker-metrics: { internal: true } # prometheus -> rabbitmq only, so services cannot reach the broker this way
  edge: { internal: true } # envoy -> order, inventory
  services: { internal: true } # order -> inventory, payment
  events: { internal: true } # order, notification -> rabbitmq
  mail: { internal: true } # notification -> mailpit
  inventory-data: { internal: true }
  payment-data: { internal: true }
  order-data: { internal: true }
  notification-data: { internal: true }

volumes:
  inventory-db:
  payment-db:
  order-db:
  notification-db:
  rabbitmq:
